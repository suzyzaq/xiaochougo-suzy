<style>

  .card .tag{display:inline-block;font-size:11px;font-weight:700;color:var(--red);background:#ffe9ec;padding:3px 9px;border-radius:999px;margin-bottom:10px}

  .card .go{margin-top:12px;font-size:13px;font-weight:700;color:var(--red)}
  footer{margin-top:26px;font-size:12px;color:#9a9a9a;text-align:center;line-height:1.7}
